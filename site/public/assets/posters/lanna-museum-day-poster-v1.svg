<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1080"
  height="1440"
  viewBox="0 0 1080 1440"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">7月26日清迈博物馆奇妙日活动海报</title>
  <desc id="description">
    探寻兰纳纹样的踪迹。活动前参观博物馆采集纹样，扫描二维码报名活动。
  </desc>

  <defs>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#D9C2E1" flood-opacity="1" />
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#351145" flood-opacity="0.12" />
    </filter>
  </defs>

  <image
    href="lanna-museum-day-poster-background-v1.png"
    x="0"
    y="0"
    width="1080"
    height="1440"
    preserveAspectRatio="xMidYMid slice"
  />

  <rect x="0" y="0" width="1080" height="18" fill="#5C2683" />
  <rect x="0" y="18" width="270" height="7" fill="#D84F7E" />
  <rect x="270" y="18" width="270" height="7" fill="#D8782E" />
  <rect x="540" y="18" width="270" height="7" fill="#7F9B55" />
  <rect x="810" y="18" width="270" height="7" fill="#1997A5" />

  <g transform="translate(68 74)">
    <rect width="466" height="58" rx="29" fill="#5C2683" />
    <text
      x="233"
      y="39"
      fill="#FFFFFF"
      font-family="'PingFang SC', 'Noto Sans SC', sans-serif"
      font-size="24"
      font-weight="700"
      letter-spacing="2"
      text-anchor="middle"
    >
      AI 切磋大会 第 26 期 · 清迈场
    </text>
  </g>

  <text
    x="68"
    y="258"
    fill="#5C2683"
    font-family="'Noto Serif SC', 'Songti SC', serif"
    font-size="122"
    font-weight="800"
    letter-spacing="-7"
  >
    7月26日
  </text>

  <text
    x="72"
    y="352"
    fill="#211625"
    font-family="'PingFang SC', 'Noto Sans SC', sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="3"
  >
    清迈博物馆奇妙日
  </text>

  <text
    x="70"
    y="423"
    fill="#5C2683"
    font-family="'Noto Serif SC', 'Songti SC', serif"
    font-size="48"
    font-weight="800"
    letter-spacing="-1"
  >
    探寻兰纳纹样的踪迹
  </text>

  <g transform="translate(70 470)">
    <circle cx="12" cy="12" r="10" fill="#D84F7E" />
    <circle cx="40" cy="12" r="10" fill="#D8782E" />
    <circle cx="68" cy="12" r="10" fill="#7F9B55" />
    <circle cx="96" cy="12" r="10" fill="#1997A5" />
    <line x1="128" y1="12" x2="448" y2="12" stroke="#5C2683" stroke-width="2" opacity="0.22" />
  </g>

  <g transform="translate(68 548)" filter="url(#paper-shadow)">
    <rect width="506" height="182" rx="4" fill="#FBF8F1" stroke="#5C2683" stroke-width="3" />
    <rect width="174" height="44" fill="#5C2683" />
    <text
      x="87"
      y="30"
      fill="#FFFFFF"
      font-family="'PingFang SC', 'Noto Sans SC', sans-serif"
      font-size="20"
      font-weight="800"
      letter-spacing="2"
      text-anchor="middle"
    >
      活动前任务
    </text>
    <text
      x="28"
      y="94"
      fill="#211625"
      font-family="'PingFang SC', 'Noto Sans SC', sans-serif"
      font-size="29"
      font-weight="800"
      letter-spacing="1"
    >
      提前参观博物馆
    </text>
    <text
      x="28"
      y="140"
      fill="#5C2683"
      font-family="'PingFang SC', 'Noto Sans SC', sans-serif"
      font-size="29"
      font-weight="800"
      letter-spacing="1"
    >
      采集一枚吸引你的兰纳纹样
    </text>
  </g>

  <g transform="translate(70 764)">
    <text
      x="0"
      y="0"
      fill="#554A59"
      font-family="'PingFang SC', 'Noto Sans SC', sans-serif"
      font-size="23"
      font-weight="600"
      letter-spacing="1"
    >
