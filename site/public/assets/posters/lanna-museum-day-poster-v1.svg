    </text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="0" y="1110" width="1080" height="330" fill="#FBF8F1" fill-opacity="0.98" />
  </g>
  <rect x="0" y="1110" width="1080" height="8" fill="#5C2683" />
  <rect x="0" y="1118" width="270" height="5" fill="#D84F7E" />
  <rect x="270" y="1118" width="270" height="5" fill="#D8782E" />
  <rect x="540" y="1118" width="270" height="5" fill="#7F9B55" />
  <rect x="810" y="1118" width="270" height="5" fill="#1997A5" />

  <g transform="translate(68 1188)">
    <text
      x="0"
      y="0"
      fill="#5C2683"
      font-family="'Noto Serif SC', 'Songti SC', serif"
      font-size="54"
      font-weight="800"
      letter-spacing="-2"
    >
      扫描二维码
    </text>
    <text
      x="0"
      y="64"
      fill="#211625"
      font-family="'PingFang SC', 'Noto Sans SC', sans-serif"
      font-size="42"
      font-weight="800"
      letter-spacing="2"
    >
      报名活动
    </text>
    <text
      x="0"
      y="120"
      fill="#554A59"
      font-family="'PingFang SC', 'Noto Sans SC', sans-serif"
      font-size="22"
      font-weight="600"
      letter-spacing="1"
    >
      打开活动网站 · 报名入群
    </text>
    <g transform="translate(0 158)">
      <path d="M0 0H418" stroke="#5C2683" stroke-width="2" opacity="0.22" />
      <circle cx="12" cy="26" r="8" fill="#D84F7E" />
      <circle cx="36" cy="26" r="8" fill="#D8782E" />
      <circle cx="60" cy="26" r="8" fill="#7F9B55" />
      <circle cx="84" cy="26" r="8" fill="#1997A5" />
    </g>
  </g>

  <g transform="translate(768 1154)">
    <rect x="0" y="0" width="260" height="260" rx="8" fill="#FFFFFF" stroke="#5C2683" stroke-width="4" />
    <image
      href="lanna-museum-day-website-qr.png"
      x="16"
      y="16"
      width="228"
      height="228"
      preserveAspectRatio="xMidYMid meet"
    />
  </g>
</svg>
